<!DOCTYPE html>
<html>

<head>
  <title>Facebook Header / position-property-exercise</title>
  <link rel="stylesheet" href="Facebook-header.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="left-side">
      <div class="pfp">
        <img src="images/cat.jpg" alt="oliver cat profile picture">
      </div>
      <div class="user-name">
        Oliver Cat
      </div>

    </div>
    <div class="right-side">
      <button class="add-friend">
        Add Friend
      </button>
      <button class="message">
        Message
      </button>
    </div>
  </div>
</body>

</html>
