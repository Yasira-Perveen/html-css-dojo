<!DOCTYPE html>
<html>

<head>
  <title>Discord-sidebars-practice</title>
  <link rel="stylesheet" href="discord-sidebar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="avatar-sidebar">
    <div>
      <img class="pfp" src="images/cat.jpg" alt="cat sitting on windowsill">
    </div>
    <div>
      <img class="pfp" src="images/cat2.jpg" alt="cat sitting on windowsill">
    </div>
    <div>
      <img class="pfp" src="images/dog2.jpg" alt="Dog profile picture">
    </div>
  </div>
  <div class="channel-sidebar">
    <div class="header">
      <div class="info">INFO</div>
      <div class="add">+</div>
    </div>

    <div class="channel-item"># new-videos</div>
    <div class="channel-item"># updates</div>
    <div class="channel-item"># faq</div>

  </div>
</body>

</html>
