<!DOCTYPE html>
<html>
  <head>
    <title>Nested Layout</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="13c-nested-layout.css">
  </head>
  <body>
    <div class="container">
    <div class="vertical">
      ALL INBOXES
    </div>
    <div class="vertical">
      <div class="horizontal">
        <img src="images/cat.jpg">
      </div>
      <div class="horizontal">
          <div class="nested-vertical">
            <div class="nested-horizontal-left">Chewy Promotions</div>
            <div class="nested-horizontal-right">4:58 PM</div>
          </div>
          <div class="nested-vertical">
            Biggest sales of the year!
          </div>
          <div class="nested-vertical">
            <p>Hey there! We're writing to tell you about our...</p>
          </div>
      </div>
    </div>
    </div>
    </body>
    </html>
